          "https://d3dt2vfw6hdfn0.cloudfront.net/IMG_1373.JPG",
        ];

        const addImageToContainer = (container, image) => {
          return new Promise((resolve, reject) => {
            const img = document.createElement('img');
            img.src = image;
            img.onload = () => {
              container.appendChild(img);
              resolve(img);
            };
          });
        };

        container = document.getElementById("images-div")
        for (const image of images) {
          await addImageToContainer(container, image);
        }
      }

      window.onload = () => {
        loadImages();
      };
    </script>
